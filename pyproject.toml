[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramid-slide-video-workflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pillow>=11",
    "python-pptx>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.27"]
build = ["pyinstaller>=6.16"]

[project.scripts]
video-workflow-ui = "video_workflow.ui:main"
video-workflow-web = "video_workflow.web.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real Linux media and slide tools"]

[tool.setuptools.packages.find]
include = ["video_workflow*"]

[tool.setuptools.package-data]
video_workflow = ["web/static/*"]
