[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyramid-slide-video-workflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "python-pptx>=1.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
build-video = "video_workflow.cli:main"
build-video-batch = "video_workflow.batch_cli:main"
video-workflow-ui = "video_workflow.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires real Linux media and slide tools"]

[tool.setuptools.packages.find]
include = ["video_workflow*"]
